databases:
  - name: trendzone-db
    plan: free
    databaseName: trendzone
    user: trendzone

services:
  - type: web
    name: trendzone-backend
    runtime: docker
    dockerfilePath: ./docker/backend.Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trendzone-db
          property: connectionString
      - key: SHOPEE_GRAPHQL_URL
        value: https://open-api.affiliate.shopee.com.br/graphql
      - key: SHOPEE_APP_ID
        sync: false
      - key: SHOPEE_SECRET
        sync: false
      - key: FACEBOOK_PAGE_ID
        sync: false
      - key: FACEBOOK_PAGE_TOKEN
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SECRET_KEY
        sync: false
    healthCheckPath: /health
