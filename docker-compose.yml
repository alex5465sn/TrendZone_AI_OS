version: "3.9"

services:
  # ========================================
  # Nginx Reverse Proxy + SSL/TLS
  # ========================================
  nginx:
    build:
      context: .
      dockerfile: docker/nginx.Dockerfile
    container_name: trendzone_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs/letsencrypt:/etc/letsencrypt
      - ./certs/certbot:/var/www/certbot
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - trendzone_network

  waha:
    image: devlikeapro/waha:latest
    container_name: trendzone_waha
    env_file:
      - .env
    environment:
      WHATSAPP_DEFAULT_ENGINE: WEBJS
      WAHA_PRINT_QR: "false"
      WAHA_API_KEY: ${WAHA_API_KEY}
    volumes:
      - ./waha_sessions:/app/.sessions
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    networks:
      - trendzone_network

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: trendzone_backend
    env_file:
      - .env
    environment:
      WAHA_URL: http://waha:3000
    volumes:
      - ./backend/trendzone.db:/app/backend/trendzone.db
      - ./backend/logs:/app/backend/logs
      - ./backend/media:/app/backend/media
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    networks:
      - trendzone_network

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://app.trendzone.app/api}
    container_name: trendzone_frontend
    ports:
      - "127.0.0.1:4173:4173"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - trendzone_network

networks:
  trendzone_network:
    driver: bridge
