version: "3.9"

services:
  waha:
    image: devlikeapro/waha:latest
    container_name: trendzone_waha
    env_file:
      - .env
    environment:
      WHATSAPP_DEFAULT_ENGINE: WEBJS
      WAHA_PRINT_QR: "false"
      WAHA_API_KEY: ${WAHA_API_KEY}
    volumes:
      - ./waha_sessions:/app/.sessions
    ports:
      - "3000:3000"
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: trendzone_backend
    env_file:
      - .env
    environment:
      WAHA_URL: http://waha:3000
    volumes:
      - ./backend/trendzone.db/trendzone.db:/app/backend/trendzone.db
      - ./backend/logs:/app/backend/logs
      - ./backend/media:/app/backend/media
    ports:
      - "8000:8000"
    depends_on:
      - waha
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://127.0.0.1:8000}
    container_name: trendzone_frontend
    ports:
      - "4173:4173"
    depends_on:
      - backend
    restart: unless-stopped
